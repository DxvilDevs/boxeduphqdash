name: Deploy Boxed Up HQ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL repository secret" && exit 1)
          test -n "$SUPABASE_KEY" || (echo "Missing SUPABASE_PUBLISHABLE_KEY (or legacy SUPABASE_ANON_KEY) repository secret" && exit 1)

      - name: Build static site and generate runtime config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html styles.css app.js manifest.webmanifest service-worker.js .nojekyll dist/
          cp -R assets dist/assets
          python3 - <<'PY'
          import json, os, pathlib
          out = pathlib.Path("dist/config.js")
          url = os.environ["SUPABASE_URL"].strip()
          key = os.environ["SUPABASE_KEY"].strip()
          out.write_text(
              "window.BOXED_UP_CONFIG = " + json.dumps({
                  "SUPABASE_URL": url,
                  "SUPABASE_KEY": key,
              }) + ";\n",
              encoding="utf-8",
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
